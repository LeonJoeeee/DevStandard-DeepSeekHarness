name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind test checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Install the bundle gate's YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Fixed dispatcher validation, lifetime, continuation, and cleanup
        run: python3 .github/test-dispatch.py
      - name: Current review packets, publication, and round cap
        run: python3 .github/test-review-packet.py
      - name: Hard-edge negative probes and constructed rebases
        env:
          HARD_EDGE_SHARD: rest
        run: python3 .github/test-hard-edges.py
      - name: dsh bundle rows, the one model anchor, and the generated role personas
        run: python3 .github/check-dsh-bundle.py
      - name: The dsh guard's ported engine matches the policy it was ported from
        run: python3 .github/check-dsh-guard.py
      - name: No @path references (they force-load context)
        run: |
          ! grep -rn "@[a-zA-Z0-9_-]*/" reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: Every ADR amendment block is announced by its status line
        run: python3 .github/check-adr-index.py
      - name: The bundle's release manifest declares a dotted numeric version
        run: |
          python3 - <<'EOF'
          import json, re
          version = json.load(open('package.json'))['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), \
              f'the release manifest version is not a dotted numeric release: {version!r}'
          print('release manifest:', version)
          EOF

      - name: live pages carry the surviving 0039/0040 invariants and none of the retired claims
        run: |
          set -e
          # This asserts only DevStandard's documentation path shape; semantic admission remains merge check 1.
          python3 - <<'PY'
          import pathlib,re,subprocess

          paths=subprocess.check_output(["git","ls-files","-z"]).decode().rstrip("\0").split("\0")
          markdown=[p for p in paths if pathlib.PurePosixPath(p).suffix.lower()==".md"]
          candidates=[p for p in markdown if "/" not in p or p.split("/",1)[0].casefold()=="docs"]
          root={"README.md","CLAUDE.md"}
          allowed=[]
          rejected=[]
          for path in candidates:
              ok=(
                  ("/" not in path and path in root)
                  or path in {"docs/PRD.md","docs/architecture.md"}
                  or re.fullmatch(r"docs/adr/\d{4}-[^/]+\.md",path)
                  or re.fullmatch(r"docs/specs/\d{4}-\d{2}-\d{2}-[^/]+\.md",path)
                  or re.fullmatch(r"docs/architecture/[^/]+\.md",path)
              )
              (allowed if ok else rejected).append(path)
          assert not rejected, f"non-canonical documentation paths: {rejected}"
          folded={}
          for path in allowed:
              folded.setdefault(path.casefold(),[]).append(path)
          duplicates=[group for group in folded.values() if len(group)>1]
          assert not duplicates, f"case-folded documentation path collisions: {duplicates}"

          predicate=pathlib.Path("reference/in-repo-writes.md").read_text().splitlines()
          start="<!-- BEGIN IN-REPO-WRITES PREDICATE -->"
          end_re=re.compile(r"<!-- END IN-REPO-WRITES PREDICATE \((\d+) payload lines\) -->")
          starts=[i for i,line in enumerate(predicate) if line==start]
          ends=[(i,end_re.fullmatch(line)) for i,line in enumerate(predicate) if end_re.fullmatch(line)]
          assert len(starts)==1 and len(ends)==1, "predicate block must have exactly one start and one counted end marker"
          begin=starts[0]
          end,match=ends[0]
          assert begin<end, "predicate block markers are reversed"
          actual=end-begin-1
          declared=int(match.group(1))
          assert actual==declared, f"predicate block declares {declared} payload lines, found {actual}"
          print(f"documentation paths canonical; predicate block {actual} payload lines")
          PY
          # retirement asserted, not assumed
          test ! -e .devstandard || { echo ".devstandard survives"; exit 1; }
          test ! -e scripts/codex-adopt || { echo "codex-adopt survives"; exit 1; }
          test ! -e AGENTS.md || { echo "managed AGENTS.md survives"; exit 1; }
          grep -qxF "/.claude/worktrees/" .gitignore || { echo "worktree ignore line missing"; exit 1; }
          # Retired identity/adoption claims; Claude orchestration is supported again (0045).
          for pat in "if unsure whether" "one ongoing primary session" "never the main session" "codex-adopt" ".devstandard"; do
            if grep -rnF "$pat" reference/ README.md docs/architecture.md docs/PRD.md CLAUDE.md | grep -v "docs/adr\|docs/specs\|Migrating from v0.27"; then
              echo "retired claim found: $pat"; exit 1
            fi
          done
          # positive invariants
          grep -q "operational-memory file on every harness" reference/repo-claude-md.md
          # 0040 as amended 2026-09-11 (#332): the executor default is the host's own subagent.
          # The gate still asserts the method states a default; the sentence it asserts is the
          # current one, and it is carried by each self-contained role page (ADR 0059).
          for page in reference/orchestrator.md reference/worker.md; do
            grep -q "Dispatched work goes to the host's own subagent" "$page"
          done
          # 0040/0050 as amended 2026-09-19 (#406): the dated standing record is replaced by the anchored
          # worker and reviewer rows. They are stated once, on the dispatch page, in the cell form
          # scripts/dispatch parses, and no Codex model the page names ANYWHERE is restated on another
          # live page -- the sweep below reads every `gpt-` literal on the whole page, so the arbitration
          # and one-off-subagent settings outside the anchored rows are single-sited by it too (#411).
          # ADR and spec history excluded by design; counted by occurrence and by path, not by line.
          python3 - <<'PY'
          import glob,re
          page="reference/orchestrator.md"
          # live pages = everything a session may read as instruction, enumerated dynamically; ADR and spec history excluded
          hist=("docs/adr/","docs/specs/","_source/",".claude/",".git/","node_modules/")
          live=[f for f in glob.glob("**/*.md",recursive=True) if not f.startswith(hist)]
          t=open(page).read()
          # the anchors are READ from the page, never repeated here: exactly one machine-readable row per
          # role, both columns in the `model` at `effort` form scripts/dispatch requires
          rows=re.findall(r"^\| (worker|reviewer) \| `([^`|]+)` at `([^`|]+)` \| `([^`|]+)` at `([^`|]+)` \|$", t, re.M)
          assert [r[0] for r in rows]==["worker","reviewer"], f"anchored rows: want one machine-readable row per role, got {rows}"
          models=sorted(set(re.findall(r"`(gpt-[^`]+)`", t)))
          assert models, "the page names no Codex model"
          # Arbitration (#460): the PR route and the pre-PR direct invocation run one setting, and
          # the direct one stays read-only, history-free and captured to a file.
          packet=re.search(r"review-packet start --implementation codex --model (\S+) --effort (\S+?)`", t)
          direct=re.search(r"^codex exec (.*)$", t, re.M)
          assert packet and direct, "arbitration: want the review-packet route and one direct codex exec"
          flags=direct[1].split()
          assert "--ephemeral" in flags and "-o" in flags and flags[flags.index("-s")+1]=="read-only", \
              "arbitration: the direct invocation must be --ephemeral, -s read-only and -o captured"
          assert flags[flags.index("-m")+1]==packet[1] and "model_reasoning_effort='\"%s\"'"%packet[2] in flags, \
              "arbitration: the two routes name different settings"
          for f in live:
              if f==page: continue
              text=open(f).read()
              for m in models:
                  assert m not in text, f"anchored model {m!r} restated in {f}"
          print(f"anchored settings: one row per role, machine-readable, single-sited (models {models}, read from the page)")
          PY
          grep -q "Codex" README.md
          grep -q "Claude Code and Codex" docs/PRD.md
          ! grep -q "devstandard-fallback" README.md reference/in-repo-writes.md
          grep -q "this brief is what makes you a worker" reference/worker.md || grep -qi "This brief is what makes you a worker" reference/worker.md
          for page in reference/orchestrator.md reference/worker.md; do
            grep -q 'every dispatched worker receives `reference/worker.md`' "$page"
          done
          # worktree-ignore trigger sites. Every creation path carries the pre-creation check;
          # since #413 the worker page is not one: it never creates a lane, and its pointer to
          # the orchestrator's Worktree lifecycle section went with the trigger.
          grep -q "check-ignore -q .claude/worktrees/probe" reference/orchestrator.md
          grep -q "seeds the in-repo worktree root" reference/ci-pipelines.md || grep -q "worktree root into" reference/ci-pipelines.md
          grep -q "worktree directory must be gitignored" reference/orchestrator.md
          grep -q "pre-creation ignore check" reference/orchestrator.md
          # per-ADR 0039 presence
          for a in 0006 0007 0008 0015 0016 0018 0019 0024 0038; do
            grep -l "Amended by 0039 (2026-08-26)" docs/adr/${a}-*.md >/dev/null || { echo "ADR $a missing 0039 status entry"; exit 1; }
            grep -l "see 0039" docs/adr/${a}-*.md >/dev/null || { echo "ADR $a missing 0039 block"; exit 1; }
          done
          # Claude Code is the only host (ADR 0063): no Codex host carrier survives, and the
          # Codex CLI executor keeps its page, which the orchestrator page routes to.
          test ! -e .codex-plugin || { echo ".codex-plugin survives"; exit 1; }
          test ! -e .agents || { echo "Codex repository marketplace survives"; exit 1; }
          test ! -e skills/devstandard || { echo "Codex recovery skill survives"; exit 1; }
          grep -q 'harness-codex.md' reference/orchestrator.md
          grep -q 'BEGIN CODEX WORKER MECHANICS' reference/harness-codex.md
          ! grep -q 'codex-native' reference/orchestrator.md reference/harness-codex.md reference/worker.md
          echo "static assertions OK"

  sweep:
    name: sweep (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind sweep checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Role word-list sweep across every position, role, and tool format
        env:
          HARD_EDGE_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: python3 .github/test-hard-edges.py

  # The port's runtime job: the dsh bundle composed into a throwaway headless-derived profile and
  # driven against a local deterministic OpenAI-compatible endpoint (design §(h)). It carries the
  # runner axes the retired Codex job had — a macOS leg and Python 3.12 — so the coverage #14
  # dropped by accident comes back here rather than nowhere.
  dsh:
    name: dsh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind test checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the bundle gate's YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install the dsh runtime and the pnpm its plugin manager shells out to
        run: |
          # `--install-strategy=nested` keeps each package's dependencies inside its own
          # node_modules. A default (hoisted) prefix install strands `@deepseek-ai/dsh`'s sibling
          # packages at the prefix root — not the layout a global `dsh` install has, and not the
          # one `.github/test-dsh-bundle.py` resolves the bundle's rows against.
          npm install --prefix "$RUNNER_TEMP/devstandard-dsh" --install-strategy=nested \
            @deepseek-ai/dsh@0.2.0-rc.2 pnpm@11.25.0
          echo "$RUNNER_TEMP/devstandard-dsh/node_modules/.bin" >> "$GITHUB_PATH"
      - name: dsh bundle end to end — role delivery, tool surface and guard
        run: python3 .github/test-dsh-bundle.py
      # Restored coverage (#18 item 3): retiring the Codex job in #14 dropped these as collateral.
      # They run here because this job is where a macOS runner and a Python 3.12 interpreter live.
      # #16 removed the sibling `test-session-start.py` step with its subject, `hooks/`.
      - name: Detached process and review publication on Python 3.12
        run: |
          python3 .github/test-dispatch.py
          python3 .github/test-review-packet.py

  # Preserve the branch-protection context; every dependency must actually pass.
  test:
    if: ${{ always() }}
    needs: [suite, sweep, dsh]
    runs-on: ubuntu-latest
    steps:
      - name: Require the ordinary suite, every sweep shard, and the dsh job
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          DSH_RESULT: ${{ needs.dsh.result }}
        run: |
          test "$SUITE_RESULT" = success
          test "$SWEEP_RESULT" = success
          test "$DSH_RESULT" = success

  merged-result:
    name: merged-result / ${{ github.event.pull_request.base.sha }} / ${{ github.event.pull_request.head.sha }}
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Report that this exact merge result passed the test job
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
