name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Test (the same checks CI runs gate the release)
        run: |
          ! grep -rn "@[a-zA-Z0-9_-]*/" reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: The release manifest version must match the tag
        run: |
          python3 - <<'EOF'
          import json, os
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          version = json.load(open('package.json'))['version']
          assert version == tag, f'release manifest={version} tag={tag}'
          EOF
      - name: Publish GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to publish."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
